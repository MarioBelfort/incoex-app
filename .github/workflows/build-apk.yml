name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar proyecto Android
        run: |
          flutter create --platforms=android --org com.incoex --project-name incoex_app .
          rm -rf test
          sed -i 's/android:label="incoex_app"/android:label="INCOEX"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Dependencias e ícono
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Compilar APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/INCOEX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: INCOEX-apk
          path: dist/INCOEX.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: INCOEX · versión ${{ github.run_number }}
          body: |
            APK para Android compilado automáticamente.
            Descarga **INCOEX.apk** desde tu teléfono Android y ábrelo para instalar.
          files: dist/INCOEX.apk
          make_latest: true
